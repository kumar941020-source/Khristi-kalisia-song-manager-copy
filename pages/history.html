    <style>

        /* ==========================================
           ATTENDANCE CYCLE HISTORY
        ========================================== */

        .cycle-history-section {
            margin-top: 30px;
        }

        .cycle-history-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .cycle-history-title h2 {
            margin: 0;
        }

        .cycle-history-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            border: 1px solid #eeeeee;
        }

        .cycle-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .cycle-history-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cycle-history-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            font-size: 22px;
        }

        .cycle-history-name h3 {
            margin: 0 0 4px;
        }

        .cycle-history-name p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        .cycle-delete-btn {
            border: none;
            border-radius: 9px;
            padding: 9px 13px;
            cursor: pointer;
            background: #fee2e2;
            color: #dc2626;
            font-weight: 600;
        }

        .cycle-delete-btn:hover {
            background: #fecaca;
        }

        .cycle-summary-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .cycle-summary-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .cycle-summary-item span {
            display: block;
            font-size: 13px;
            color: #777;
            margin-bottom: 6px;
        }

        .cycle-summary-item strong {
            font-size: 18px;
        }

        .cycle-overall {
            background: #f0fdf4;
        }

        .cycle-empty {
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 700px) {

            .cycle-history-header {
                align-items: flex-start;
            }

            .cycle-summary-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

    </style>

</head>
