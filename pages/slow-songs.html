<head>

<meta charset="UTF-8">

</title>


<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../css/dashboard.css">



</head>


<body>


<div class="sidebar">

<h2>
✝ Khristi Kalisia
</h2>


<a href="../index.html">
Dashboard
</a>


<a href="fast-songs.html">
Fast Songs

<a href="settings.html">
Settings
</a>


</div>





<div class="main">


<div class="top-header">

<h1>
Slow Songs
</h1>

</div>






<div class="section admin-only">


<h2>
Add New Slow Song
</h2>



<input 
type="text"
id="slowSongName"
placeholder="Enter song name"
>



<input
type="date"
id="slowSongDate"
>



<button 
class="btn-primary admin-only"
onclick="addSlow()">

Add Song

</button>



</div>








<div class="section">


<h2>
Slow Song List
</h2>




<input 
type="text"
placeholder="Search Song"
onkeyup="searchSlow(this.value)"
>





<table>


<thead>

<tr>

<th>
Song Name
</th>


<th>
Last Sung
</th>


<th>
Times Sung
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="slowSongTable">

</tbody>



</table>



</div>




</div>







<script type="module" src="../script1.js"></script>

<script type="module" src="../js/slow-songs.js"></script>
<script type="module" src="../js/admin.js"></script>

<!-- ==========================
     LYRICS MODAL
========================== -->

<div id="lyricsModal" class="lyrics-modal">

    <div class="lyrics-box">

        <span class="close-lyrics" onclick="closeLyrics()">&times;</span>

        <h2>🎵 Song Lyrics</h2>

        <h3 id="lyricsSongName">Song Name</h3>

        <textarea
            id="lyricsText"
            rows="15"
            placeholder="Write song lyrics here...">
        </textarea>

        <div class="lyrics-buttons">

            <button class="btn-primary admin-only"
                onclick="saveLyrics()">
                💾 Save Lyrics
            </button>

            <button class="btn-danger"
                onclick="closeLyrics()">
                Close
            </button>

        </div>

    </div>

</div>

</body>

</html>
