<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | Khristi Kalisia Worship Song Manager</title>

<link rel="stylesheet" href="../style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

<div class="main full-page">


<div class="top-header">

<div>

<h1>
⚙ Settings
</h1>

<p>
Manage your worship song manager settings.
</p>

</div>


<a href="../index.html">

<button class="dashboard-btn">
⬅ Dashboard
</button>

</a>


</div>



<div class="settings-container">


<div class="settings-card">

<i class="fa-solid fa-church"></i>

<h2>
Church Information
</h2>

<label>
Church Name
</label>

<input 
type="text"
id="churchName"
placeholder="Khristi Kalisia">


<label>
Pastor Name
</label>

<input
type="text"
id="pastorName"
placeholder="Enter Pastor Name">


<button id="saveChurchBtn">
💾 Save Information
</button>


</div>





<div class="settings-card">

<i class="fa-solid fa-database"></i>

<h2>
Data Management
</h2>


<button id="backupBtn">
⬇ Backup Data
</button>


<button id="clearDataBtn">
🗑 Clear All Data
</button>


</div>





<div class="settings-card">

<i class="fa-solid fa-circle-info"></i>

<h2>
About Application
</h2>


<p>
Khristi Kalisia Worship Song Manager
</p>

<p>
Version 1.0
</p>


</div>


</div>


</div>



<script src="../script.js"></script>

</body>

</html>
