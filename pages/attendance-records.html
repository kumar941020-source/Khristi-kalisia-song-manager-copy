<!-- MAIN -->

<div class="main">

    <div class="top-header">

        <h1>
            📅 Attendance Records
        </h1>

    </div>


    <!-- BACK -->

    <div class="section">

        <button
            class="btn-primary"
            onclick="location.href='attendence.html'">

            ← Back to Attendance

        </button>

    </div>


    <!-- RECORDS -->

    <div class="section">

        <div class="attendance-list-header">

            <h2>
                📅 Daily Attendance
            </h2>

        </div>


        <div id="attendanceRecords">

            Loading attendance records...

        </div>

    </div>

</div>


<!-- ==========================================
     EDIT ATTENDANCE MODAL
========================================== -->

<div
    id="editAttendanceModal"
    class="modal">

    <div class="modal-content">

        <h2>
            ✏ Edit Attendance
        </h2>


        <h3 id="editAttendanceDate">
            Date
        </h3>


        <p id="editAttendanceType">
            Attendance
        </p>


        <div id="editAttendanceMembers">

        </div>


        <button
            class="btn-primary admin-only"
            onclick="updateAttendanceRecord()">

            💾 Update Attendance

        </button>


        <button
            class="btn-danger"
            onclick="closeEditAttendance()">

            ✖ Close

        </button>

    </div>

</div>
