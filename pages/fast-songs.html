<div class="main">


<div class="top-header">

<h1>
Fast Songs
</h1>


</div>





<div class="section admin-only">


<h2>
Add New Fast Song
</h2>



<input 
type="text"
id="fastSongName"
placeholder="Enter song name"
>



<input
type="date"
id="fastSongDate"
>




<button 
class="btn-primary admin-only"
onclick="addFast()">

Add Song

</button>



</div>






<div class="section">


<h2>
Fast Song List
</h2>



<input 
type="text"
placeholder="Search Song"
onkeyup="searchFast(this.value)"
>



<table>


<thead>

<tr>

<th>
Song Name
</th>


<th>
Last Sung
</th>


<th>
Times Sung
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="fastSongTable">


</tbody>



</table>

<!-- ==========================
     LYRICS MODAL
========================== -->

<div id="lyricsModal" class="lyrics-modal">

    <div class="lyrics-box">

        <span class="close-lyrics" onclick="closeLyrics()">&times;</span>

        <h2>🎵 Song Lyrics</h2>

        <h3 id="lyricsSongName">Song Name</h3>

        <textarea
            id="lyricsText"
            rows="15"
            placeholder="Write song lyrics here...">
        </textarea>

        <div class="lyrics-buttons">

            <button class="btn-primary admin-only"
                onclick="saveLyrics()">
                💾 Save Lyrics
            </button>

            <button class="btn-danger"
                onclick="closeLyrics()">
                Close
            </button>

        </div>

    </div>

</div>
